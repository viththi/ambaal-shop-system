name: Ambaal Shop Docker Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker-test:
    name: Build and Test Ambaal Shop
    runs-on: ubuntu-latest

    steps:
      # Checkout the GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Check Docker installation
      - name: Check Docker
        run: |
          docker --version
          docker compose version

      # Validate docker-compose.yml
      - name: Validate Docker Compose
        run: docker compose config

      # Build the Flask Docker image
      - name: Build Docker containers
        run: docker compose build

      # Start MySQL and Flask
      - name: Start Docker containers
        run: docker compose up -d

      # Give the containers time to initialize
      - name: Wait for services
        run: sleep 30

      # Show container status
      - name: Check container status
        run: docker compose ps -a

      # Show MySQL logs
      - name: Show MySQL logs
        if: always()
        run: docker compose logs mysql

      # Show Flask application logs
      - name: Show Flask application logs
        if: always()
        run: docker compose logs app

      # Test whether Flask is accessible on port 5003
      - name: Test Flask application
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            http://localhost:5003/

      # Shut down containers after testing
      - name: Stop Docker containers
        if: always()
        run: docker compose down