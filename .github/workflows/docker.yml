name: Ambaal Shop Docker

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker-test:
    name: Build and Test Ambaal Shop
    runs-on: ubuntu-latest

    steps:

      # 1. Download the repository into the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Display Docker versions
      - name: Check Docker
        run: |
          docker --version
          docker compose version

      # 3. Validate docker-compose.yml
      - name: Validate Docker Compose
        run: docker compose config

      # 4. Build the Flask application image
      - name: Build Docker containers
        run: docker compose build

      # 5. Start MySQL and Flask
      - name: Start Docker containers
        run: docker compose up -d

      # 6. Wait for the services to start
      - name: Wait for services
        run: sleep 30

      # 7. Display container status
      - name: Check container status
        run: docker compose ps

      # 8. Display MySQL logs
      - name: Show MySQL logs
        if: always()
        run: docker compose logs mysql

      # 9. Display Flask application logs
      - name: Show Flask logs
        if: always()
        run: docker compose logs app

      # 10. Test the Ambaal Shop website
      - name: Test Flask website
        run: |
          curl --fail \
               --retry 10 \
               --retry-delay 5 \
               --retry-connrefused \
               http://localhost:5003/

      # 11. Stop and remove containers after testing
      - name: Stop Docker containers
        if: always()
        run: docker compose down