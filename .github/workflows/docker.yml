name: Ambaal Shop Docker Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker:
    name: Build Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Check Docker installation
      - name: Check Docker
        run: |
          docker --version
          docker compose version

      # Validate docker-compose.yml
      - name: Validate Docker Compose
        run: docker compose config

      # Build the current Flask application
      - name: Build Docker containers
        run: docker compose build

      # Start MySQL and Flask
      - name: Start Docker containers
        run: docker compose up -d

      # Wait for MySQL and Flask
      - name: Wait for services
        run: sleep 30

      # Show running containers
      - name: Check container status
        run: docker compose ps -a

      # Show MySQL logs
      - name: Show MySQL logs
        if: always()
        run: docker compose logs mysql

      # Show Flask logs
      - name: Show Flask application logs
        if: always()
        run: docker compose logs app

      # Test Flask application
      - name: Test Flask application
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            http://localhost:5003/

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Enable Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and upload image to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            viththi/viththi_arul:latest
            viththi/viththi_arul:${{ github.sha }}

      # Stop test containers
      - name: Stop Docker containers
        if: always()
        run: docker compose down